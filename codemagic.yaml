workflows:
  pediatric-vital-engine-workflow:
    name: Pediatric Vital Engine CI/CD
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Install .NET 8 SDK
        script: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 8.0
          echo 'export PATH="$PATH:$HOME/.dotnet"' >> $CM_ENV
          ~/.dotnet/dotnet workload install android
      - name: Build C# Native AOT for Android (ARM64)
        script: |
          cd csharp_engine
          # Trova la directory dell'NDK (Codemagic espone ANDROID_NDK_HOME, ma usiamo un fallback di sicurezza)
          NDK_DIR=${ANDROID_NDK_HOME:-$(ls -d /usr/local/share/android-sdk/ndk/* | tail -n 1)}
          NDK_BIN=$NDK_DIR/toolchains/llvm/prebuilt/darwin-x86_64/bin
          NDK_CLANG=$(find $NDK_BIN -name "aarch64-linux-android*-clang" | head -n 1)
          NDK_OBJCOPY=$(find $NDK_BIN -name "llvm-objcopy" | head -n 1)
          echo "Using NDK Clang: $NDK_CLANG"
          
          ~/.dotnet/dotnet publish -c Release -r linux-bionic-arm64 /p:PublishAot=true /p:PublishTrimmed=true /p:NativeLib=Shared /p:CppCompilerAndLinker=$NDK_CLANG /p:ObjCopyName=$NDK_OBJCOPY -v n || true
          
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          # Cerchiamo il file ovunque esso sia stato generato (con o senza prefisso lib)
          SO_FILE=$(find . -name "*PediatricVitalEngine.so" | head -n 1)
          cp $SO_FILE ../android/app/src/main/jniLibs/arm64-v8a/libPediatricVitalEngine.so

      - name: Flutter Packages Get
        script: |
          flutter pub get
      - name: Build Flutter Android App
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - android/app/src/main/jniLibs/arm64-v8a/libPediatricVitalEngine.so
